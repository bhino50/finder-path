name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded runs for the same ref are pointless once a newer commit exists.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build FinderPath macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate project files
        run: |
          plutil -lint Info.plist
          plutil -lint FinderPath.entitlements
          ruby -rjson -e 'ARGV.each { |path| JSON.parse(File.read(path)) }' \
            FinderPath/Assets.xcassets/Contents.json \
            FinderPath/Assets.xcassets/AppIcon.appiconset/Contents.json \
            FinderPath/Assets.xcassets/AccentColor.colorset/Contents.json \
            download-site/version.json \
            download-site/vercel.json
          bash -n script/build_and_run.sh
          bash -n script/run_no_xcode.sh
          bash -n script/test_logic.sh
          bash -n script/package_release.sh
          # `bash -n` cannot see inside a here-document, so the release path's
          # Python is compiled and executed separately (see Run logic tests).
          python3 -m py_compile \
            script/update_public_manifest.py \
            script/test_release_manifest.py

      - name: Run logic tests
        run: ./script/test_logic.sh

      - name: Build Debug app
        run: |
          xcodebuild \
            -project FinderPath.xcodeproj \
            -scheme FinderPath \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Release app
        run: |
          xcodebuild \
            -project FinderPath.xcodeproj \
            -scheme FinderPath \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath .build/ReleaseDerivedData \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build without xcodebuild
        run: ./script/run_no_xcode.sh build
